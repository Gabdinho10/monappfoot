<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonAppFoot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f4f9; padding-bottom: 70px; }
        
        .header { background-color: #1e3a8a; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; position: sticky; top: 0; z-index: 10; }
        .container { padding: 10px; }
        .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .league-title { font-size: 11px; color: #888; margin-bottom: 10px; text-transform: uppercase; }
        .match-row { display: flex; justify-content: space-between; align-items: center; }
        .team { flex: 1; display: flex; flex-direction: column; align-items: center; font-size: 13px; font-weight: bold; text-align: center; }
        .team img { width: 30px; height: 30px; margin-bottom: 5px; }
        .score { font-size: 20px; font-weight: bold; color: #1e3a8a; padding: 0 15px; }
        .status { text-align: center; font-size: 11px; margin-top: 10px; color: #059669; font-weight: bold; }
        .status.live { color: #dc2626; }
        
        .standing-row { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; background: white; font-size: 13px; }
        .standing-row:first-child { border-top-left-radius: 10px; border-top-right-radius: 10px; }
        .standing-row:last-child { border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; border-bottom: none; }
        .standing-rank { width: 25px; font-weight: bold; }
        .standing-team { flex: 1; }
        .standing-pts { font-weight: bold; color: #1e3a8a; }
        
        .prob-row { display: flex; justify-content: space-around; margin-top: 10px; text-align: center; }
        .prob-box { font-size: 18px; font-weight: bold; }
        .prob-label { font-size: 11px; color: #666; font-weight: normal; }
        
        /* Formulaire Clé API */
        .input-key { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .btn-save { background: #1e3a8a; color: white; padding: 15px; border: none; border-radius: 8px; width: 100%; font-weight: bold; font-size: 16px; }
        .success-msg { color: #059669; text-align: center; margin-top: 15px; font-weight: bold; display: none; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; }
        .nav-btn { flex: 1; padding: 15px 0; text-align: center; font-size: 12px; font-weight: bold; color: #888; border: none; background: transparent; }
        .nav-btn.active { color: #1e3a8a; border-bottom: 3px solid #1e3a8a; }
        
        .loader { text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>

    <div class="header">⚽ MonAppFoot</div>

    <div class="container" id="app-content">
        <div class="loader">Chargement...</div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn active" onclick="loadTab('live', this)">⚽ Live</button>
        <button class="nav-btn" onclick="loadTab('standings', this)">🏆 Classement</button>
        <button class="nav-btn" onclick="loadTab('predictions', this)">🔮 Prédictions</button>
        <button class="nav-btn" onclick="loadTab('settings', this)">⚙️ Clé API</button>
    </div>

    <script>
        // On récupère la clé sauvegardée dans le téléphone, ou une chaîne vide
        let API_KEY = localStorage.getItem('football_api_key') || '';
        
        // L'adresse avec le proxy pour éviter l'erreur "Failed to fetch"
        const BASE_URL = 'https://corsproxy.io/?https://v3.football.api-sports.io';
        const SEASON = 2024;
        const LEAGUE_ID = 61; // Ligue 1

        async function apiCall(endpoint, params = {}) {
            if (!API_KEY) {
                throw new Error("Veuillez d'abord enregistrer votre clé API dans l'onglet ⚙️ Clé API.");
            }
            
            const query = new URLSearchParams(params).toString();
            const url = `${BASE_URL}/${endpoint}?${query}`;
            
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'x-apisports-key': API_KEY
                }
            });
            const data = await response.json();
            return data.response;
        }

        function loadTab(tab, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const content = document.getElementById('app-content');

            if (tab === 'settings') {
                renderSettings();
                return;
            }

            if (!API_KEY) {
                content.innerHTML = '<div class="card" style="color:#dc2626; text-align:center;">Veuillez configurer votre clé API dans l\'onglet ⚙️ <b>Clé API</b>.</div>';
                return;
            }

            content.innerHTML = '<div class="loader">Chargement des données...</div>';

            try {
                if (tab === 'live') {
                    apiCall('fixtures', { live: 'all' }).then(matches => {
                        if (matches.length === 0) {
                            apiCall('fixtures', { date: new Date().toISOString().split('T')[0] }).then(m => renderMatches(m));
                        } else {
                            renderMatches(matches);
                        }
                    });
                } 
                else if (tab === 'standings') {
                    apiCall('standings', { league: LEAGUE_ID, season: SEASON }).then(standings => {
                        renderStandings(standings[0]?.league?.standings[0] || []);
                    });
                }
                else if (tab === 'predictions') {
                    apiCall('fixtures', { league: LEAGUE_ID, season: SEASON, next: 3 }).then(fixtures => {
                        renderPredictions(fixtures);
                    });
                }
            } catch (error) {
                content.innerHTML = `<div class="card" style="color:red;">Erreur : ${error.message}</div>`;
            }
        }

        function renderSettings() {
            const content = document.getElementById('app-content');
            content.innerHTML = `
                <div class="card">
                    <h3 style="margin-bottom:10px; color:#1e3a8a;">⚙️ Configuration de l'API</h3>
                    <p style="font-size:14px; color:#555;">Collez votre clé API-Football ci-dessous. Elle sera sauvegardée sur ce téléphone.</p>
                    <input type="text" id="api-key-input" class="input-key" value="${API_KEY}" placeholder="Collez votre clé ici...">
                    <button class="btn-save" onclick="saveApiKey()">Enregistrer la clé</button>
                    <p id="save-status" class="success-msg">✅ Clé enregistrée avec succès !</p>
                </div>
            `;
        }

        function saveApiKey() {
            const input = document.getElementById('api-key-input').value.trim();
            if (input) {
                API_KEY = input;
                localStorage.setItem('football_api_key', input);
                const status = document.getElementById('save-status');
                status.style.display = 'block';
                setTimeout(() => { status.style.display = 'none'; }, 3000);
            } else {
                alert('Veuillez entrer une clé valide.');
            }
        }

        function renderMatches(matches) {
            const content = document.getElementById('app-content');
            if (matches.length === 0) {
                content.innerHTML = '<div class="card">Aucun match pour le moment.</div>';
                return;
            }

            let html = '';
            matches.forEach(match => {
                const isLive = ['1H', '2H', 'HT'].includes(match.fixture.status.short);
                html += `
                    <div class="card">
                        <div class="league-title">${match.league.name} - ${match.league.country}</div>
                        <div class="match-row">
                            <div class="team">
                                <img src="${match.teams.home.logo}" alt="logo">
                                ${match.teams.home.name}
                            </div>
                            <div class="score">${match.goals.home ?? '-'} - ${match.goals.away ?? '-'}</div>
                            <div class="team">
                                <img src="${match.teams.away.logo}" alt="logo">
                                ${match.teams.away.name}
                            </div>
                        </div>
                        <div class="status ${isLive ? 'live' : ''}">
                            ${isLive ? '● EN DIRECT - ' + match.fixture.status.elapsed + "'" : match.fixture.status.long}
                        </div>
                    </div>
                `;
            });
            content.innerHTML = html;
        }

        function renderStandings(standings) {
            const content = document.getElementById('app-content');
            let html = '<div class="card" style="padding:0; overflow:hidden;">';
            
            standings.forEach(row => {
                html += `
                    <div class="standing-row">
                        <div class="standing-rank">${row.rank}</div>
                        <div class="standing-team">${row.team.name}</div>
                        <div class="standing-pts">${row.points} pts</div>
                    </div>
                `;
            });
            html += '</div>';
            content.innerHTML = html;
        }

        async function renderPredictions(fixtures) {
            const content = document.getElementById('app-content');
            let html = '';

            for (let match of fixtures) {
                let preds = await apiCall('predictions', { fixture: match.fixture.id });
                let pct = preds[0]?.predictions?.percent;

                html += `
                    <div class="card">
                        <div class="league-title">${match.league.name}</div>
                        <div style="text-align:center; font-weight:bold; font-size:15px; margin-bottom:5px;">
                            ${match.teams.home.name} vs ${match.teams.away.name}
                        </div>
                        <div style="text-align:center; font-size:11px; color:#666; margin-bottom:10px;">
                            ${new Date(match.fixture.date).toLocaleDateString('fr-FR')}
                        </div>
                        ${pct ? `
                        <div class="prob-row">
                            <div class="prob-box" style="color:#22c55e;">${pct.home}<div class="prob-label">Domicile</div></div>
                            <div class="prob-box" style="color:#eab308;">${pct.draw}<div class="prob-label">Nul</div></div>
                            <div class="prob-box" style="color:#ef4444;">${pct.away}<div class="prob-label">Extérieur</div></div>
                        </div>` : '<div style="text-align:center; font-size:12px; color:#999;">Pas de prédiction</div>'}
                    </div>
                `;
            }
            content.innerHTML = html;
        }

        // Au démarrage, on ouvre l'onglet de configuration si la clé est vide, sinon l'onglet Live
        window.onload = () => {
            if (!API_KEY) {
                loadTab('settings', document.querySelectorAll('.nav-btn')[3]);
            } else {
                loadTab('live', document.querySelector('.nav-btn'));
            }
        };
    </script>
</body>
</html>
